<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RS ज्वेलर्स — शुद्ध सोना, शुद्ध चाँदी, शुद्ध भरोसा</title>
  <meta name="description" content="RS ज्वेलर्स, बड़ा सराफा इंदौर — स्क्रॉल करें और शिल्प की उड़ान देखें।" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wdth,wght@75..125,100..800&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/logo.jpg" />

  <style>
    /* Brand palette — black + gold. --sw-accent drives the ambient glow colour. */
    :root, .sw-root {
      --sw-bg: #0A0A0A;         /* video background = black */
      --sw-ink: #F2EDE2;        /* cream body text */
      --sw-ink-soft: #B9A87E;   /* muted gold */
      --sw-accent: #C9A227;     /* gold — ambient light */
      --sw-font-display: 'Tiro Devanagari Hindi', Georgia, serif;
      --sw-font-body: 'Anek Devanagari', system-ui, sans-serif;
    }
    /* Luxury black/gold: keep the warm glow, drop the drifting particles (read busy). */
    .sw-particles { display: none !important; }

    /* Real crest logo instead of the placeholder gradient chip. Logo's own bg is
       near-black already, so it blends with --sw-bg with no cutout needed. */
    .sw-brand__mark {
      width: 34px; height: 34px; border-radius: 8px;
      background: url('assets/logo.jpg') center / contain no-repeat;
      box-shadow: none;
    }

    /* Type system. Display: Tiro Devanagari Hindi — a real Devanagari serif, natively 400
       only, so it is never synthetic-bolded; reserved for the headline alone. Text: Anek
       Devanagari, one variable file (wght 100–800 + a width axis) carrying real weights
       across BOTH scripts, so mixed lines like "Instagram" and "BIS प्रमाणित" set in one
       face instead of fracturing. Replaces four static Hind weights — net lighter.
       No letter-spacing anywhere on Devanagari: tracking breaks the shirorekha. */
    .sw-copy__title { font-weight: 400; }
    /* The engine already sets the eyebrow in the body face; only the brand mark still
       needs moving off Tiro, which has no bold to give it. */
    .sw-brand__name {
      font-family: var(--sw-font-body);
      font-weight: 700;
    }

    /* Top nav pill: was a flat white glass chip sitting ON the footage like a sticker.
       Tint the blur with the page background instead of white so it reads as the
       footage itself thickening behind the label, not a UI decal bolted on top. */
    .sw-nav {
      background: color-mix(in srgb, var(--sw-bg) 55%, transparent);
      border: 1px solid color-mix(in srgb, var(--sw-accent) 22%, transparent);
      box-shadow: 0 8px 24px color-mix(in srgb, #000 40%, transparent);
    }
    .sw-nav__item.is-active { color: #0A0A0A; }

    /* Root cause of "everything sits bottom-left": the engine centers .sw-copy with
       top:50%/transform:translateY(-50%), but its scroll handler overwrites
       `transform` every tick with just the reveal-drift translateY, dropping the
       -50% and leaving the block pinned by its TOP edge at mid-screen — so content
       always reads lower-half. Make the box span the full height and center its
       content with flexbox instead, so the JS's small transform jitter never has
       to carry the centering job. Desktop only — mobile's bottom-anchored band
       (already correct) is untouched. Cycle vertical rhythm per section so the
       four scenes don't all land in the same band. */
    @media (min-width: 861px) {
      .sw-copy {
        top: 0; bottom: 0; transform: none;
        display: flex; flex-direction: column; justify-content: center;
      }
      .sw-copy:nth-of-type(4n+2) { justify-content: flex-start; padding-top: 14vh; }
      .sw-copy:nth-of-type(4n+3) { justify-content: flex-end; padding-bottom: 12vh; }
    }

    /* Branded loader veil — hides only once the engine can paint scene 1, the
       page has fully loaded, and the display fonts are ready (see gate logic
       in the inline script below). */
    #loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;
      background:var(--sw-bg);transition:opacity .6s ease;}
    #loader img{width:clamp(96px,18vw,160px);border-radius:14px;
      animation:loader-pulse 1.8s ease-in-out infinite;}
    #loader.is-done{opacity:0;pointer-events:none;}
    @keyframes loader-pulse{0%,100%{opacity:.55;transform:scale(.97)}
      50%{opacity:1;transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){#loader img{animation:none;}}
  </style>
</head>
<body>
  <div id="loader" aria-hidden="true"><img src="assets/logo.jpg" alt="" /></div>
  <div id="top"></div>
  <div id="world"></div>

  <script src="scrub-engine.js"></script>
  <script>
    // Same 860px line the engine uses (isMobile()) — never two breakpoints.
    const isPhone = window.matchMedia('(hover: none) and (pointer: coarse)').matches
                 || window.matchMedia('(max-width: 860px)').matches;
    const LOADER_MIN = isPhone ? 4200 : 3000;    // brand beat floor
    const LOADER_MAX = isPhone ? 12000 : 9000;   // safety net — never trap the user
    const t0 = performance.now();

    // (a) engine built: layout() ran AND scene 1 can paint
    let markReady;
    const engineReady = new Promise(r => { markReady = r; });
    // (b) window load: all images, the mobile-swapped clip's metadata, stylesheets
    const pageLoad = new Promise(r => {
      if (document.readyState === 'complete') r();
      else window.addEventListener('load', r, { once: true });
    });
    // (c) fonts (Tiro Devanagari + Anek Devanagari) — avoids a reflow behind the veil
    const fontsReady = (document.fonts && document.fonts.ready) || Promise.resolve();

    let hidden = false;
    function hideLoader() {
      if (hidden) return;
      hidden = true;
      const l = document.getElementById('loader');
      if (!l) return;
      l.classList.add('is-done');
      setTimeout(() => l.remove(), 700);          // after the .6s opacity transition
    }

    Promise.all([engineReady, pageLoad, fontsReady])
      .then(() => new Promise(r =>
        setTimeout(r, Math.max(0, LOADER_MIN - (performance.now() - t0)))))
      .then(hideLoader);
    setTimeout(hideLoader, LOADER_MAX);

    mountScrollWorld(document.getElementById('world'), {
      onReady: () => markReady(),
      atmosphere: true,                                  // gold ambient glow (particles hidden via CSS)
      brand: { name: 'RS ज्वेलर्स', href: '#top' },
      cta: { label: 'Instagram', href: 'https://instagram.com/rsjewellersindore' },
      hint: 'स्क्रॉल करें',
      diveScroll: 1.3,
      connScroll: 0.9,
      sections: [
        {
          id: 'silhouette', label: 'विरासत',
          still: 'assets/poster_1.png',
          clip: 'assets/vid/1.mp4',
          clipMobile: 'assets/vid/1-m.mp4',
          accent: '#C9A227',
          scroll: 1.7, linger: 0.5,                      // hero — longest dwell
          eyebrow: 'शुद्ध सोना, शुद्ध चाँदी',
          title: 'एक विरासत, एक पहचान।',
          body: 'बड़ा सराफा, इंदौर — पीढ़ियों से चला आ रहा भरोसा।',
          tags: ['बड़ा सराफा', 'इंदौर'],
        },
        {
          id: 'craft', label: 'शिल्प',
          still: 'assets/poster_2.png',
          clip: 'assets/vid/2.mp4',
          clipMobile: 'assets/vid/2-m.mp4',
          accent: '#C9A227',
          scroll: 1.5, linger: 0.5,                      // was 1.0/no-linger — burned a 5s clip
                                                         // in 1vh (fastest seeks on the page) and
                                                         // flashed the copy through its 0.5 peak
          eyebrow: 'हर टुकड़े में शिल्प',
          title: 'बारीकी से गढ़ा हुआ।',
          body: 'हर गहना हाथ से गढ़ा, हर बारीकी पर ध्यान।',
          tags: ['हस्तनिर्मित', 'बारीक शिल्प'],
        },
        {
          id: 'purity', label: 'शुद्धता',
          still: 'assets/poster_3.png',
          clip: 'assets/vid/3.mp4',
          clipMobile: 'assets/vid/3-m.mp4',
          accent: '#E6C96A',                             // warmer glow on the macro-gem reveal
          scroll: 1.2, linger: 0.5,                      // settle on the sparkle
          eyebrow: 'असली चमक',
          title: 'शुद्धता जो दिखती है।',
          body: 'हॉलमार्क शुद्धता — जो आँखों से भी झलके।',
          tags: ['हॉलमार्क', 'BIS प्रमाणित'],
        },
        {
          id: 'finale', label: 'भरोसा',
          still: 'assets/poster_4.png',
          clip: 'assets/vid/4.mp4',
          clipMobile: 'assets/vid/4-m.mp4',
          accent: '#C9A227',
          scroll: 1.8, linger: 0.4,                      // finale — longest dwell + CTA
          eyebrow: 'और यह सब मिलकर बनता है',
          title: 'शुद्ध सोना, शुद्ध चाँदी, शुद्ध भरोसा।',
          body: 'आज ही जुड़ें — RS ज्वेलर्स, इंदौर।',
          tags: [],
          cta: {
            primary:   { label: 'Instagram @rsjewellersindore', href: 'https://instagram.com/rsjewellersindore' },
            secondary: { label: 'कॉल / WhatsApp', href: 'https://wa.me/917869541656' },
          },
        },
      ],
      connectors: [],          // segments are cuts of one continuous shot → frame-continuous, engine crossfades
      connectorsMobile: [],
    });
  </script>
</body>
</html>
